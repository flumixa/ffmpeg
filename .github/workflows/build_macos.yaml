name: "base:ffmpeg-macos"

# Builds ffmpeg + ffprobe for Apple Silicon (arm64) only.
#
# x86_64 was dropped because GitHub's macos-13 (Intel) runner pool is heavily
# congested and Intel macOS is being phased out — jobs queued for hours
# waiting for an Intel runner. To re-enable, restore the matrix include for
# arch:x86_64 + runner:macos-13 and the universal lipo job at the bottom of
# this file (see git history for the full version).

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "ffmpeg version (must match patches in contrib/)"
        required: true
        default: "8.0.1"
  workflow_call:
    inputs:
      ffmpeg_version:
        type: string
        required: false
        default: "8.0.1"
  push:
    branches:
      - "8.0"
    paths:
      - "scripts/build-macos.sh"
      - ".github/workflows/build_macos.yaml"
      - "contrib/**"

jobs:
  build:
    name: build (arm64)
    runs-on: macos-14
    env:
      FFMPEG_VERSION: ${{ inputs.ffmpeg_version || '8.0.1' }}
      ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-14-v1

      - name: Cache ffmpeg source tarball
        uses: actions/cache@v4
        with:
          path: .work-macos-arm64/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.gz
          key: ffmpeg-src-${{ env.FFMPEG_VERSION }}

      - name: Build ffmpeg
        run: bash scripts/build-macos.sh

      - name: Smoke test
        run: |
          ./dist/ffmpeg-${{ env.FFMPEG_VERSION }}-darwin-arm64/ffmpeg  -version
          ./dist/ffmpeg-${{ env.FFMPEG_VERSION }}-darwin-arm64/ffprobe -version
          ./dist/ffmpeg-${{ env.FFMPEG_VERSION }}-darwin-arm64/ffmpeg  -buildconf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-darwin-arm64
          path: dist/ffmpeg-${{ env.FFMPEG_VERSION }}-darwin-arm64.tar.gz
          retention-days: 14
